[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-cost-sentinel"
version = "0.1.0"
description = "A FinOps sentinel that ingests AWS cost data, detects spending anomalies, forecasts spend, and alerts on budget drift."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tenalisriharsha" }]

dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
forecast = ["prophet>=1.1"]
alerts = ["slack-sdk>=3.27"]
dashboard = ["streamlit>=1.37", "plotly>=5.22"]
aws = ["boto3>=1.34"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "moto[s3]>=5.0",
    "cloud-cost-sentinel[aws,forecast]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_cost_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
